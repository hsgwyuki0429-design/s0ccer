<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>s0ccer — Phase 1 prototype</title>
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%2320303a' stroke-width='3'/%3E%3C/svg%3E"
/>

<style>
  :root {
    color-scheme: dark;
    --ui: rgba(255, 255, 255, 0.88);
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d2015;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    /* タッチ操作をブラウザのジェスチャに食われないようにする */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .hud {
    position: fixed;
    pointer-events: none;
    color: var(--ui);
  }
  #score {
    top: env(safe-area-inset-top, 0px);
    left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  #score .home {
    color: #4da3ff;
  }
  #score .away {
    color: #ff6b4d;
  }
  #power {
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: min(320px, 62vw);
  }
  #power .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    opacity: 0.6;
    margin-bottom: 4px;
    text-align: center;
  }
  #power .track {
    height: 10px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.5);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  #power .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7ed957, #ffe14d);
    transition: none;
  }
  #power .fill.max {
    background: #ffe14d;
  }
  #status {
    top: calc(52px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.06em;
    opacity: 0.6;
    white-space: nowrap;
  }
  #debug {
    top: calc(8px + env(safe-area-inset-top, 0px));
    left: calc(10px + env(safe-area-inset-left, 0px));
    font-size: 11px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    opacity: 0.55;
    white-space: pre;
  }
  #hint {
    right: calc(10px + env(safe-area-inset-right, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    font-size: 11px;
    line-height: 1.6;
    text-align: right;
    opacity: 0.5;
    white-space: pre;
  }
  #reset {
    pointer-events: auto;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.4);
    color: var(--ui);
    font-size: 12px;
    cursor: pointer;
  }
  #flash {
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(40px, 12vw, 96px);
    font-weight: 800;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.25s;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
  }
  #flash.show {
    opacity: 1;
  }
</style>

<canvas id="game"></canvas>

<div class="hud" id="score">
  <span class="home" id="score-home">0</span>
  <span style="opacity: 0.4">−</span>
  <span class="away" id="score-away">0</span>
</div>

<div class="hud" id="power">
  <div class="label">POWER</div>
  <div class="track"><div class="fill" id="power-fill"></div></div>
</div>

<div class="hud" id="status"></div>
<div class="hud" id="debug"></div>
<div class="hud" id="hint"></div>
<button class="hud" id="reset">RESET</button>
<div class="hud" id="flash"></div>

<script type="module" src="/src/main.ts"></script>
